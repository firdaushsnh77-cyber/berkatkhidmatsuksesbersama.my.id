<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Foto Interaktif 3D - 64 Halaman A4</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Page Flip Library JS -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Caveat:wght@600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #121212;
            overflow-x: hidden;
        }

        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        /* Container & Page Aspect Ratio Setup (A4 ratio: 1 : 1.414) */
        .page-flip-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: auto;
        }

        .page {
            background-color: #fdfbf7;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.06);
            user-select: none;
        }

        /* Hardcover Page Styling */
        .page.--page-cover {
            background-color: #2b1d14;
            color: #f3e5ab;
            border: 2px solid #3d2b1f;
        }

        .page.--page-cover-front {
            box-shadow: inset 5px 0 25px rgba(0,0,0,0.5), 10px 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px 12px 12px 4px;
        }

        .page.--page-cover-back {
            box-shadow: inset -5px 0 25px rgba(0,0,0,0.5), -10px 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px 4px 4px 12px;
        }

        /* Realistic Spine Shadow */
        .page-left {
            box-shadow: inset -18px 0 24px -10px rgba(0, 0, 0, 0.18), inset 0 0 15px rgba(0,0,0,0.03);
            border-radius: 4px 0 0 4px;
        }

        .page-right {
            box-shadow: inset 18px 0 24px -10px rgba(0, 0, 0, 0.18), inset 0 0 15px rgba(0,0,0,0.03);
            border-radius: 0 4px 4px 0;
        }

        /* Paper Texture Gradient */
        .paper-texture {
            background-image: radial-gradient(#d3c7b2 0.5px, transparent 0.5px), radial-gradient(#d3c7b2 0.5px, #fdfbf7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Photo Frame Shadow */
        .photo-card {
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.1), 0 2px 6px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .photo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.15);
        }

        /* Table Surface Backgrounds */
        .bg-wood {
            background: radial-gradient(circle, rgba(38,26,18,0.85) 0%, rgba(18,12,8,0.98) 100%), 
                        repeating-linear-gradient(45deg, #1f140e 0px, #1f140e 2px, #261a12 2px, #261a12 4px);
        }
    </style>
</head>
<body class="bg-wood text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Top Navigation / Header Toolbar -->
    <header class="w-full bg-black/40 backdrop-blur-md border-b border-white/10 px-4 py-3 z-30 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-amber-600/20 text-amber-500 rounded-lg border border-amber-500/30">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-semibold text-amber-100 leading-tight font-serif-title">Album Kenangan Interaktif (64 Halaman)</h1>
                <p class="text-xs text-slate-400">Ukuran A4 (21 x 29.7 cm) • 32 Lembar Flipbook 3D Realistis</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <!-- Audio Toggle -->
            <button id="btn-audio" onclick="toggleAudio()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg backdrop-blur border border-white/10 transition flex items-center gap-2" title="Suara Pembalik Halaman">

            <!-- Fullscreen Button -->

                <i id="icon-fullscreen" class="fa-solid fa-expand"></i>
                <span class="hidden sm:inline">Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Interactive Album Canvas Workspace -->
    <main class="flex-1 flex items-center justify-center relative p-4 overflow-hidden min-h-[580px]">
        
        <!-- Zoom Wrapper Container -->
        <div id="zoom-wrapper" class="transition-transform duration-300 transform scale-100 flex items-center justify-center">

            <i class="fa-solid fa-hand-pointer text-amber-400 animate-pulse"></i>
            <span>Klik sudut halaman atau geser (drag) untuk membalik kertas</span>
        </div>
    </main>

    <!-- Bottom Toolbar Controls -->
    <footer class="w-full bg-black/50 backdrop-blur-md border-t border-white/10 px-4 py-3 z-30 flex flex-wrap items-center justify-between gap-4">
        
        <!-- Navigation & Direct Jump Controls -->
        <div class="flex items-center gap-2 mx-auto sm:mx-0 flex-wrap">
            <button onclick="pageFlip.turnToFirstPage()" class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition" title="Halaman Pertama (1)">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button onclick="pageFlip.flipPrev()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-chevron-left"></i>
                <span class="hidden sm:inline">Sebelumnya</span>
            </button>
            
            <!-- Direct Page Jump Input -->
            <div class="flex items-center gap-1 px-3 py-1 bg-black/40 rounded-lg border border-white/10 text-xs font-mono text-amber-300">
                <span>Hal</span>
                <input type="number" id="jump-page-input" min="1" max="64" value="1" onchange="jumpToPage(this.value)" class="w-10 bg-slate-900 border border-slate-700 text-amber-300 text-center rounded text-xs py-0.5 px-1 focus:outline-none focus:border-amber-500">
                <span id="total-page-count-display">/ 64</span>
            </div>

            <button onclick="pageFlip.flipNext()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1">
                <span class="hidden sm:inline">Selanjutnya</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button onclick="pageFlip.turnToLastPage()" class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition" title="Halaman Terakhir (64)">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Zoom Controls -->
        <div class="flex items-center gap-2 mx-auto sm:mx-0">
            <span class="text-xs text-slate-400">Zoom:</span>
            <button onclick="changeZoom(-0.1)" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-200 rounded-lg text-xs transition" title="Zoom Out">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="zoom-level-text" class="text-xs font-mono text-slate-300 min-w-[40px] text-center">100%</span>
            <button onclick="changeZoom(0.1)" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-200 rounded-lg text-xs transition" title="Zoom In">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="resetZoom()" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-400 hover:text-slate-200 rounded-lg text-xs transition" title="Reset Zoom">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </div>
    </footer>

        // Struktur Data Lengkap Seluruh 64 Halaman
        const albumPages = [
            // Halaman 1: Sampul Depan
            {
                type: 'cover-front',
                title: 'ALBUM KENANGAN 64 HALAMAN',
                subtitle: 'Koleksi Istimewa Momen Berharga',
                date: '2024 - 2026'

            // Halaman 2 sampai 63 (Diisi Otomatis Menggunakan PHOTO_URLS di Atas)

                type: 'content',

                photos: [

                        url: url,

            // Halaman 64: Sampul Belakang
            {

                title: 'AKHIR ALBUM',
                subtitle: 'Terima Kasih Telah Membuka Kenangan Ini'
            }
        ];

        const TOTAL_PAGES = albumPages.length; // Total 64 Halaman

        let pageFlip = null;
        let isAudioMuted = false;
        let currentZoom = 1;
        let audioCtx = null;

        /* ==========================================================================
           REALISTIC AUDIO SYNTHESIZER (Efek Suara Kertas)
           ========================================================================== */
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playPaperTurnSound() {
            if (isAudioMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = audioCtx.sampleRate * 0.16;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(1.5, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                console.log('Audio Autoplay Restriction', e);
            }
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = document.getElementById('icon-audio');
            const label = document.getElementById('label-audio');

            if (isAudioMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                label.innerText = 'Suara: OFF';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-400';
                label.innerText = 'Suara: ON';
                playPaperTurnSound();
            }
        }

        /* ==========================================================================
           RENDER BENTUK TAMPILAN HALAMAN PADA DOM
           ========================================================================== */
        function renderPagesToDOM() {
            const container = document.getElementById('flipbook-container');
            container.innerHTML = '';

            albumPages.forEach((page, index) => {
                const pageNum = index + 1;
                const pageEl = document.createElement('div');
                pageEl.className = 'page paper-texture';

                // Halaman 1: Cover Front
                if (page.type === 'cover-front') {
                    pageEl.classList.add('--page-cover', '--page-cover-front', 'page-right');
                    pageEl.innerHTML = `
                        <div class="h-full flex flex-col justify-between p-8 text-center border-4 border-amber-600/30 rounded-lg m-2 bg-gradient-to-br from-amber-950/40 to-black/60">
                            <div class="mt-8">
                                <i class="fa-solid fa-crown text-amber-400 text-3xl mb-4"></i>
                                <h1 class="text-2xl font-bold font-serif-title tracking-wider text-amber-200 uppercase leading-snug">${page.title}</h1>
                                <div class="w-16 h-0.5 bg-amber-500/50 mx-auto my-3"></div>
                                <p class="text-xs text-amber-300/80 italic font-serif">${page.subtitle || ''}</p>
                            </div>
                            <div class="my-auto py-8">
                                <div class="w-24 h-24 mx-auto rounded-full border-2 border-amber-500/40 p-1 flex items-center justify-center">
                                    <i class="fa-solid fa-book-open text-amber-400 text-4xl"></i>
                                </div>
                            </div>
                            <div class="mb-4">
                                <span class="px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[11px] font-mono rounded-full">Edisi Lengkap 64 Halaman</span>
                                <p class="text-[10px] font-mono text-amber-400/60 mt-2">${page.date || ''}</p>
                            </div>
                        </div>
                    `;
                } 
                // Halaman 64: Cover Back
                else if (page.type === 'cover-back') {
                    pageEl.classList.add('--page-cover', '--page-cover-back', 'page-left');
                    pageEl.innerHTML = `
                        <div class="h-full flex flex-col justify-center items-center p-8 text-center border-4 border-amber-600/30 rounded-lg m-2 bg-gradient-to-br from-black/60 to-amber-950/40">
                            <i class="fa-solid fa-heart text-amber-500 text-3xl mb-3"></i>
                            <h2 class="text-xl font-bold font-serif-title text-amber-200">${page.title}</h2>
                            <p class="text-xs text-amber-300/80 mt-2 italic">${page.subtitle || ''}</p>
                            <p class="text-[10px] font-mono text-amber-500/40 mt-8">Halaman ${TOTAL_PAGES} dari ${TOTAL_PAGES}</p>
                        </div>
                    `;
                } 
                // Halaman Isi Foto (Halaman 2 - 63)
                else {
                    const isEven = pageNum % 2 === 0;
                    pageEl.classList.add(isEven ? 'page-left' : 'page-right');

                    let photoContentHtml = '';

                    if (page.layout === 'text-only') {
                        photoContentHtml = `
                            <div class="flex-1 flex flex-col justify-center items-center my-auto p-6 text-center">
                                <i class="fa-solid fa-quote-left text-amber-800/20 text-4xl mb-3"></i>
                                <p class="font-handwriting text-slate-800 text-xl leading-relaxed">${page.photos[0]?.caption || 'Catatan kenangan indah...'}</p>
                            </div>
                        `;
                    } else if (page.layout === 'double') {
                        photoContentHtml = `
                            <div class="flex-1 flex flex-col justify-center gap-3 my-auto">
                                ${ (page.photos || []).slice(0, 2).map(p => `
                                    <div class="bg-white p-2 rounded-lg photo-card border border-slate-200">
                                        <div class="overflow-hidden rounded bg-slate-100 aspect-[16/9]">
                                            <img src="${p.url}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/eee/999?text=Error+Foto'">
                                        </div>
                                        ${p.caption ? `<p class="text-center font-handwriting text-slate-700 text-xs mt-1 truncate">${p.caption}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else if (page.layout === 'quad') {
                        photoContentHtml = `
                            <div class="flex-1 grid grid-cols-2 gap-2 my-auto">
                                ${ (page.photos || []).slice(0, 4).map(p => `
                                    <div class="bg-white p-1.5 rounded photo-card border border-slate-200 flex flex-col justify-between">
                                        <div class="overflow-hidden rounded bg-slate-100 aspect-square">
                                            <img src="${p.url}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/eee/999?text=Error'">
                                        </div>
                                        ${p.caption ? `<p class="text-center font-handwriting text-slate-700 text-[10px] mt-0.5 truncate">${p.caption}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else { // 'single' Layout 1 Foto Utama
                        const p = page.photos[0] || {};
                        photoContentHtml = `
                            <div class="flex-1 flex flex-col justify-center my-auto">
                                <div class="bg-white p-3 rounded-lg photo-card border border-slate-200">
                                    <div class="overflow-hidden rounded border border-slate-100 bg-slate-100 aspect-[4/3]">
                                        <img src="${p.url || 'https://placehold.co/800x600/eee/999?text=Kosong'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/800x600/eee/999?text=Error+Foto'">
                                    </div>
                                    ${p.caption ? `<p class="text-center font-handwriting text-slate-700 text-base mt-2 px-2">${p.caption}</p>` : ''}
                                </div>
                            </div>
                        `;
                    }

                    pageEl.innerHTML = `
                        <div class="h-full flex flex-col p-6 justify-between">
                            <div class="border-b border-slate-200/80 pb-1.5 mb-2 flex justify-between items-center">
                                <h3 class="font-serif-title text-slate-800 font-semibold text-xs tracking-wide truncate">${page.title || 'Momen Bagus'}</h3>
                                <i class="fa-solid fa-leaf text-amber-700/30 text-[10px]"></i>
                            </div>

                            ${photoContentHtml}

                            <div class="pt-2 border-t border-slate-200/60 flex justify-between items-center text-[10px] text-slate-400 font-mono">
                                <span>Album A4</span>
                                <span>-${pageNum}-</span>

                container.appendChild(pageEl);
            });
        }

        /* ==========================================================================
           INITIALIZATION LIB PAGE FLIP 3D
           ========================================================================== */
        function initPageFlip() {
            if (pageFlip) {
                pageFlip.destroy();
            }

            renderPagesToDOM();

            const windowWidth = window.innerWidth;
            let width = 380;
            let height = 537;

            if (windowWidth < 500) {
                width = 270;
                height = 381;
            } else if (windowWidth < 768) {
                width = 320;
                height = 452;
            } else if (windowWidth > 1400) {
                width = 430;
                height = 608;
            }

            pageFlip = new St.PageFlip(document.getElementById('flipbook-container'), {
                width: width,
                height: height,
                size: "fixed",
                minWidth: 250,
                maxWidth: 500,
                minHeight: 350,
                maxHeight: 700,
                drawShadow: true,
                showCover: true,
                maxAngle: 30,
                useMouseEvents: true,
                flippingTime: 700
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            pageFlip.on('flip', (e) => {
                playPaperTurnSound();
                updatePageNumberDisplay();
            });

            pageFlip.on('changeState', (e) => {
                if (e.data === 'flipping') {
                    initAudio();
                }
            });

            updatePageNumberDisplay();
        }

        function updatePageNumberDisplay() {
            if (!pageFlip) return;
            const current = pageFlip.getCurrentPageIndex() + 1;
            document.getElementById('jump-page-input').value = current;
        }

        function jumpToPage(val) {
            let pageNum = parseInt(val);
            if (isNaN(pageNum)) return;
            pageNum = Math.max(1, Math.min(TOTAL_PAGES, pageNum));
            if (pageFlip) {
                pageFlip.turnToPage(pageNum - 1);
            }
        }

        /* ==========================================================================
           ZOOM & FULLSCREEN CONTROLS
           ========================================================================== */
        function changeZoom(delta) {
            currentZoom = Math.max(0.6, Math.min(1.5, currentZoom + delta));
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }

        function applyZoom() {
            const wrapper = document.getElementById('zoom-wrapper');
            wrapper.style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-level-text').innerText = `${Math.round(currentZoom * 100)}%`;
        }

        function toggleFullscreen() {
            const icon = document.getElementById('icon-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                icon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                icon.className = 'fa-solid fa-expand';
            }
        }

        /* Window Event Listeners */
        window.addEventListener('resize', () => {
            if (pageFlip) initPageFlip();
        });

        window.onload = function() {
            initPageFlip();
        };
    </script>
</body>
</html>
