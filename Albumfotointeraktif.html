<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Foto Full Page 3D - Fixed</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Page Flip Library JS -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #121212;
            overflow-x: hidden;
        }

        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }

        /* Container Pembatas Utama (Mencegah elemen bocor di bawah) */
        .page-flip-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: auto;
            overflow: hidden; /* Mengunci animasi agar tidak melayang keluar */
            padding: 10px;
        }

        .page {
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            user-select: none;
        }

        /* Hardcover Styling */
        .page.--page-cover {
            background-color: #2b1d14;
            color: #f3e5ab;
            border: 2px solid #3d2b1f;
        }

        .page.--page-cover-front {
            box-shadow: inset 5px 0 25px rgba(0,0,0,0.5), 10px 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px 12px 12px 4px;
        }

        .page.--page-cover-back {
            box-shadow: inset -5px 0 25px rgba(0,0,0,0.5), -10px 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px 4px 4px 12px;
        }

        /* Spine Shadows */
        .page-left {
            box-shadow: inset -18px 0 24px -10px rgba(0, 0, 0, 0.3);
            border-radius: 4px 0 0 4px;
        }

        .page-right {
            box-shadow: inset 18px 0 24px -10px rgba(0, 0, 0, 0.3);
            border-radius: 0 4px 4px 0;
        }

        .spine-shadow-left {
            background: linear-gradient(to left, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 100%);
        }
        .spine-shadow-right {
            background: linear-gradient(to right, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 100%);
        }

        .bg-wood {
            background: radial-gradient(circle, rgba(38,26,18,0.85) 0%, rgba(18,12,8,0.98) 100%), 
                        repeating-linear-gradient(45deg, #1f140e 0px, #1f140e 2px, #261a12 2px, #261a12 4px);
        }
    </style>
</head>
<body class="bg-wood text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Header Toolbar -->
    <header class="w-full bg-black/40 backdrop-blur-md border-b border-white/10 px-4 py-3 z-30 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-amber-600/20 text-amber-500 rounded-lg border border-amber-500/30">
                <i class="fa-solid fa-image text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-semibold text-amber-100 leading-tight font-serif-title">Album Foto Full-Bleed A4 (64 Halaman)</h1>
                <p class="text-xs text-slate-400">1 Foto Penuh Per Halaman • Mode 2 Halaman Konsisten</p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <button id="btn-audio" onclick="toggleAudio()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg backdrop-blur border border-white/10 transition flex items-center gap-2">
                <i id="icon-audio" class="fa-solid fa-volume-high text-amber-400"></i>
                <span id="label-audio" class="hidden sm:inline">Suara: ON</span>
            </button>

            <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg backdrop-blur border border-white/10 transition flex items-center gap-2">
                <i id="icon-fullscreen" class="fa-solid fa-expand"></i>
                <span class="hidden sm:inline">Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex items-center justify-center relative p-4 overflow-hidden min-h-[580px]">
        <div id="zoom-wrapper" class="transition-transform duration-300 transform scale-100 flex items-center justify-center overflow-hidden">
            <div id="flipbook-container" class="page-flip-container shadow-2xl">
                <!-- Halaman dirender otomatis oleh JS -->
            </div>
        </div>

        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 text-xs text-slate-300 pointer-events-none hidden md:flex items-center gap-2 shadow-lg z-20">
            <i class="fa-solid fa-hand-pointer text-amber-400 animate-pulse"></i>
            <span>Klik sudut halaman atau geser untuk membalik</span>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full bg-black/50 backdrop-blur-md border-t border-white/10 px-4 py-3 z-30 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-2 mx-auto sm:mx-0 flex-wrap">
            <button onclick="pageFlip.turnToFirstPage()" class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition" title="Sampul Depan">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button onclick="pageFlip.flipPrev()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-chevron-left"></i>
                <span class="hidden sm:inline">Sebelumnya</span>
            </button>
            
            <div class="flex items-center gap-1 px-3 py-1 bg-black/40 rounded-lg border border-white/10 text-xs font-mono text-amber-300">
                <span>Hal</span>
                <input type="number" id="jump-page-input" min="1" max="64" value="1" onchange="jumpToPage(this.value)" class="w-10 bg-slate-900 border border-slate-700 text-amber-300 text-center rounded text-xs py-0.5 px-1 focus:outline-none focus:border-amber-500">
                <span id="total-page-count-display">/ 64</span>
            </div>

            <button onclick="pageFlip.flipNext()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1">
                <span class="hidden sm:inline">Selanjutnya</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button onclick="pageFlip.turnToLastPage()" class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition" title="Sampul Belakang">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <div class="flex items-center gap-2 mx-auto sm:mx-0">
            <span class="text-xs text-slate-400">Zoom:</span>
            <button onclick="changeZoom(-0.1)" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-200 rounded-lg text-xs transition">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="zoom-level-text" class="text-xs font-mono text-slate-300 min-w-[40px] text-center">100%</span>
            <button onclick="changeZoom(0.1)" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-200 rounded-lg text-xs transition">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="resetZoom()" class="p-1.5 bg-white/10 hover:bg-white/20 text-slate-400 hover:text-slate-200 rounded-lg text-xs transition">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </div>
    </footer>

    <script>
        const DAFTAR_HALAMAN = Array.from({ length: 62 }, (_, i) => ({
            halaman: i + 2,
            foto: `https://picsum.photos/seed/full_page_${i + 2}/800/1131`
        }));

        const SAMPUL_DEPAN = {
            judul: "ALBUM FOTO KENANGAN",
            subJudul: "Koleksi Momen Spesial 64 Halaman",
            tahun: "2024 - 2026"
        };

        const SAMPUL_BELAKANG = {
            judul: "TERIMA KASIH",
            subJudul: "Akhir dari Album Foto"
        };

        const TOTAL_PAGES = 64;
        let pageFlip = null;
        let isAudioMuted = false;
        let currentZoom = 1;
        let audioCtx = null;

        function renderPagesToDOM() {
            const container = document.getElementById('flipbook-container');
            container.innerHTML = '';

            const pageCoverFront = document.createElement('div');
            pageCoverFront.className = 'page --page-cover --page-cover-front page-right';
            pageCoverFront.innerHTML = `
                <div class="h-full flex flex-col justify-between p-8 text-center border-4 border-amber-600/30 rounded-lg m-2 bg-gradient-to-br from-amber-950/40 to-black/60">
                    <div class="mt-8">
                        <i class="fa-solid fa-crown text-amber-400 text-3xl mb-4"></i>
                        <h1 class="text-2xl font-bold font-serif-title tracking-wider text-amber-200 uppercase leading-snug">${SAMPUL_DEPAN.judul}</h1>
                        <div class="w-16 h-0.5 bg-amber-500/50 mx-auto my-3"></div>
                        <p class="text-xs text-amber-300/80 italic font-serif">${SAMPUL_DEPAN.subJudul}</p>
                    </div>
                    <div class="my-auto py-8">
                        <div class="w-24 h-24 mx-auto rounded-full border-2 border-amber-500/40 p-1 flex items-center justify-center">
                            <i class="fa-solid fa-images text-amber-400 text-4xl"></i>
                        </div>
                    </div>
                    <div class="mb-4">
                        <span class="px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[11px] font-mono rounded-full">Edisi Full Page A4</span>
                        <p class="text-[10px] font-mono text-amber-400/60 mt-2">${SAMPUL_DEPAN.tahun}</p>
                    </div>
                </div>
            `;
            container.appendChild(pageCoverFront);

            DAFTAR_HALAMAN.forEach((item) => {
                const pageNum = item.halaman;
                const isEven = pageNum % 2 === 0;
                const pageEl = document.createElement('div');
                
                pageEl.className = `page ${isEven ? 'page-left' : 'page-right'} relative`;
                pageEl.innerHTML = `
                    <div class="w-full h-full relative overflow-hidden bg-neutral-900">
                        <img src="${item.foto}" 
                             alt="Halaman ${pageNum}" 
                             class="w-full h-full object-cover pointer-events-none" 
                             onerror="this.src='https://placehold.co/800x1131/222/666?text=Foto+Halaman+${pageNum}'">
                        
                        <div class="absolute inset-y-0 ${isEven ? 'right-0 w-8 spine-shadow-left' : 'left-0 w-8 spine-shadow-right'} pointer-events-none"></div>

                        <div class="absolute bottom-3 ${isEven ? 'left-3' : 'right-3'} bg-black/50 text-white/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-mono pointer-events-none border border-white/10">
                            ${pageNum}
                        </div>
                    </div>
                `;

                container.appendChild(pageEl);
            });

            const pageCoverBack = document.createElement('div');
            pageCoverBack.className = 'page --page-cover --page-cover-back page-left';
            pageCoverBack.innerHTML = `
                <div class="h-full flex flex-col justify-center items-center p-8 text-center border-4 border-amber-600/30 rounded-lg m-2 bg-gradient-to-br from-black/60 to-amber-950/40">
                    <i class="fa-solid fa-heart text-amber-500 text-3xl mb-3"></i>
                    <h2 class="text-xl font-bold font-serif-title text-amber-200">${SAMPUL_BELAKANG.judul}</h2>
                    <p class="text-xs text-amber-300/80 mt-2 italic">${SAMPUL_BELAKANG.subJudul}</p>
                    <p class="text-[10px] font-mono text-amber-500/40 mt-8">Halaman ${TOTAL_PAGES} dari ${TOTAL_PAGES}</p>
                </div>
            `;
            container.appendChild(pageCoverBack);
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
        }

        function playPaperTurnSound() {
            if (isAudioMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const bufferSize = audioCtx.sampleRate * 0.16;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(1.5, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {}
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = document.getElementById('icon-audio');
            const label = document.getElementById('label-audio');

            if (isAudioMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                label.innerText = 'Suara: OFF';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-400';
                label.innerText = 'Suara: ON';
                playPaperTurnSound();
            }
        }

        function initPageFlip() {
            if (pageFlip) pageFlip.destroy();

            renderPagesToDOM();

            const windowWidth = window.innerWidth;
            let width = 360;
            let height = 508;

            if (windowWidth < 500) {
                width = 250;
                height = 353;
            } else if (windowWidth < 768) {
                width = 300;
                height = 424;
            } else if (windowWidth > 1400) {
                width = 420;
                height = 594;
            }

            /* Mengunci mode landscape dan penangan ukuran */
            pageFlip = new St.PageFlip(document.getElementById('flipbook-container'), {
                width: width,
                height: height,
                size: "fixed",
                minWidth: 200,
                maxWidth: 500,
                minHeight: 300,
                maxHeight: 700,
                drawShadow: true,
                showCover: true,
                useMouseEvents: true,
                flippingTime: 700,
                mode: "landscape", /* Kunci mode 2 halaman konsisten */
                clickEventForward: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            pageFlip.on('flip', () => {
                playPaperTurnSound();
                updatePageNumberDisplay();
            });

            pageFlip.on('changeState', (e) => {
                if (e.data === 'flipping') initAudio();
            });

            updatePageNumberDisplay();
        }

        function updatePageNumberDisplay() {
            if (!pageFlip) return;
            const current = pageFlip.getCurrentPageIndex() + 1;
            document.getElementById('jump-page-input').value = current;
        }

        function jumpToPage(val) {
            let pageNum = parseInt(val);
            if (isNaN(pageNum)) return;
            pageNum = Math.max(1, Math.min(TOTAL_PAGES, pageNum));
            if (pageFlip) pageFlip.turnToPage(pageNum - 1);
        }

        function changeZoom(delta) {
            currentZoom = Math.max(0.6, Math.min(1.5, currentZoom + delta));
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById('zoom-wrapper').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-level-text').innerText = `${Math.round(currentZoom * 100)}%`;
        }

        function toggleFullscreen() {
            const icon = document.getElementById('icon-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                icon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                icon.className = 'fa-solid fa-expand';
            }
        }

        window.addEventListener('resize', () => {
            if (pageFlip) initPageFlip();
        });

        window.onload = function() {
            initPageFlip();
        };
    </script>
</body>
</html>
